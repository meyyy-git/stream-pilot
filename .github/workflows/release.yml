name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versi rilis (contoh: 1.0.0 atau v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Set release version
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          VERSION_INPUT="${REQUESTED_TAG#v}"
          if [[ ! "$VERSION_INPUT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH, for example 1.2.0." >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( 10#$MAJOR > 2100 || 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "Version components are too large." >&2
            exit 1
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 )); then
            echo "Version must be greater than v0.0.0." >&2
            exit 1
          fi

          VERSION="$VERSION" node -e "const fs=require('fs');const p='app.json';const app=JSON.parse(fs.readFileSync(p,'utf8'));app.expo.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreleaseVersionName="${{ steps.version.outputs.version }}" -PreleaseVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Prepare APK for release
        id: prep
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/stream-pilot-${TAG}.apk"

      - name: Generate release notes
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TARGET="$GITHUB_SHA"
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            TARGET="$TAG"
          fi

          PREVIOUS=""
          if git rev-parse "$TARGET^" >/dev/null 2>&1; then
            PREVIOUS="$(git describe --tags --abbrev=0 "$TARGET^" 2>/dev/null || true)"
          fi
          RANGE="$TARGET"
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$TARGET"
          fi

          FEATURES="$(mktemp)"
          FIXES="$(mktemp)"
          OTHER="$(mktemp)"
          FEATURE_PATTERN='^(feat|feature)(\([^)]*\))?!?:'
          FIX_PATTERN='^(fix|bugfix)(\([^)]*\))?!?:'

          while IFS=$'\t' read -r SHA SUBJECT; do
            [ -n "$SHA" ] || continue
            SHORT_SHA="${SHA:0:7}"
            LINE="- ${SUBJECT} ([${SHORT_SHA}](https://github.com/${REPOSITORY}/commit/${SHA}))"
            if [[ "$SUBJECT" =~ $FEATURE_PATTERN ]]; then
              echo "$LINE" >> "$FEATURES"
            elif [[ "$SUBJECT" =~ $FIX_PATTERN ]]; then
              echo "$LINE" >> "$FIXES"
            else
              echo "$LINE" >> "$OTHER"
            fi
          done < <(git log "$RANGE" --no-merges --format='%H%x09%s')

          NOTES="release-artifacts/RELEASE_NOTES.md"
          for SECTION in "Features:$FEATURES" "Fixes:$FIXES" "Other Changes:$OTHER"; do
            TITLE="${SECTION%%:*}"
            FILE="${SECTION#*:}"
            printf '## %s\n\n' "$TITLE" >> "$NOTES"
            if [ -s "$FILE" ]; then
              cat "$FILE" >> "$NOTES"
            else
              printf '_No changes._\n' >> "$NOTES"
            fi
            printf '\n' >> "$NOTES"
          done

          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Stream Pilot ${{ steps.prep.outputs.tag }}
          files: release-artifacts/*.apk
          body_path: release-artifacts/RELEASE_NOTES.md

      - name: Add release link to summary
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: echo "[Open GitHub Release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
